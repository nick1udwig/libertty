<!doctype html>
<html lang="en">
<head>
  <base href="/" data-libertty-base>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0f0d"><meta name="description" content="Your terminals, hosts, and SSH keys in one place.">
  <script>/* Apply the saved theme before first paint, matching src/theme.ts. */try{let t=JSON.parse(localStorage.getItem('libertty.theme')??'"auto"');if(!['forest','paper','ink','1776','flag','auto'].includes(t))t='auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'paper':'ink';if(t==='paper'||t==='ink'||t==='1776'||t==='flag')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>libertty</title>
</head>
<body>
<div id="exact-root"></div>
<script type="module" src="/src/exact.ts"></script>
</body>
</html>
