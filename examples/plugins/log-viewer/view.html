<style>
  :root{color-scheme:dark;font:15px system-ui;color:#eeeef6;background:#17182b}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{padding:14px;background:#24263a}h1{font-size:17px;margin:0 0 12px}form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,button{font:inherit;color:inherit;border:1px solid #44485e;border-radius:8px;padding:10px;background:#202235}input[type=search]{flex:1;min-width:120px}button{cursor:pointer}label{font-size:13px;white-space:nowrap}input[type=checkbox]{accent-color:#44d5ac}#path,#status{font-size:12px;color:#a5a8ba;margin:9px 0 0;overflow-wrap:anywhere}pre{flex:1;min-height:0;overflow:auto;margin:0;padding:14px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#d7eae2}button:focus-visible,input:focus-visible{outline:2px solid #44d5ac}button:disabled{opacity:.5}
</style>
<header><h1>Log viewer</h1><form><input id="filter" type="search" aria-label="Filter log lines" placeholder="Filter lines"><button id="refresh" type="submit">Refresh</button><label><input id="follow" type="checkbox" checked>Follow</label></form><p id="path"></p><p id="status" role="status">Connecting…</p></header>
<pre id="log" aria-label="Log contents"></pre>
<script>
(async () => {
  const context = await libertty.ready;
  const filter = document.querySelector('#filter'), follow = document.querySelector('#follow'), log = document.querySelector('#log'), status = document.querySelector('#status'), refresh = document.querySelector('#refresh');
  document.querySelector('h1').textContent = context.name;
  filter.value = typeof context.state?.filter === 'string' ? context.state.filter : '';
  follow.checked = context.state?.follow !== false;
  let text = '', busy = false, truncated = false, timer;
  const render = () => {
    const term = filter.value.toLowerCase(), lines = text.split('\n').filter(line => !term || line.toLowerCase().includes(term));
    log.textContent = lines.slice(-2000).join('\n');
    status.textContent = (truncated || lines.length > 2000 ? 'Showing the latest portion · ' : '') + (libertty.visible ? 'Updated ' + new Date().toLocaleTimeString() : 'Paused while hidden');
    if (follow.checked) log.scrollTop = log.scrollHeight;
  };
  const save = () => libertty.request('state.save', { filter: filter.value, follow: follow.checked }).catch(error => status.textContent = error.message);
  async function read() {
    if (busy || !libertty.visible) return;
    busy = true; refresh.disabled = true;
    try { const result = await libertty.request('file.read'); if (result.unchanged) return; text = result.text; truncated = result.truncated; document.querySelector('#path').textContent = result.path; render(); }
    catch (error) { status.textContent = error.message; }
    finally { busy = false; refresh.disabled = false; }
  }
  function schedule() { clearInterval(timer); if (libertty.visible && follow.checked) timer = setInterval(read, 2000); }
  document.querySelector('form').onsubmit = event => { event.preventDefault(); read(); };
  filter.oninput = () => { render(); save(); };
  follow.onchange = () => { save(); schedule(); if (follow.checked) read(); };
  libertty.onVisibility(visible => { schedule(); if (visible) read(); else status.textContent = 'Paused while hidden'; });
  schedule(); read();
})();
</script>
