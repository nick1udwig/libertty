name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check syntax, data and dependency-free unit tests
        run: timeout --kill-after=2s 20s npm run ci:quick
      - name: Check Rust formatting and canonical vocabulary
        run: |
          cargo fmt --all -- --check
          npm run contracts:vocabulary -- --check

  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}

  integration:
    name: Integration
    needs: [quick, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require quick and full verification
        env:
          QUICK: ${{ needs.quick.result }}
          VERIFY: ${{ needs.verify.result }}
        run: '[[ "$QUICK" == success && "$VERIFY" == success ]]'
