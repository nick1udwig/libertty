name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag or commit to build without publishing
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Resolve the source revision and release pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      node: ${{ steps.source.outputs.node }}
      tag: ${{ steps.source.outputs.tag }}
      voxtype_repository: ${{ steps.source.outputs.voxtype_repository }}
      voxtype_commit: ${{ steps.source.outputs.voxtype_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pins = JSON.parse(readFileSync('build/release-config.json', 'utf8'));
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const values = {
            sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            node: pins.node,
            tag: process.env.RELEASE_TAG || 'v' + version,
            voxtype_repository: pins.voxtypeMobile.repository,
            voxtype_commit: pins.voxtypeMobile.commit,
          };
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

  verify:
    needs: source
    name: Release checks
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      diagnostics-name: release-check-diagnostics

  companion:
    needs: source
    uses: ./.github/workflows/companion.yml
    with:
      repository: ${{ needs.source.outputs.voxtype_repository }}
      commit: ${{ needs.source.outputs.voxtype_commit }}

  build:
    needs: [source, companion]
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      node: ${{ needs.source.outputs.node }}
      tag: ${{ needs.source.outputs.tag }}
      voxtype-repository: ${{ needs.source.outputs.voxtype_repository }}
      voxtype-commit: ${{ needs.source.outputs.voxtype_commit }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  build-macos:
    needs: source
    name: Package darwin-arm64
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      node: ${{ needs.source.outputs.node }}
      tag: ${{ needs.source.outputs.tag }}
      voxtype-repository: ${{ needs.source.outputs.voxtype_repository }}
      voxtype-commit: ${{ needs.source.outputs.voxtype_commit }}
      target: darwin-arm64
      runner: macos-15

  publish:
    name: Publish the complete verified release
    if: github.event_name == 'push'
    needs: [source, verify, build, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.source.outputs.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: libertty-*
          path: release
          merge-multiple: true
      - name: Verify all files, upload to a draft and publish last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: node scripts/publish-release.mjs
