name: Verify

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      diagnostics-name:
        default: integration-check-diagnostics
        type: string
      reliability:
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  rust:
    name: Rust and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/verify-setup
      - name: Check native lints and tests
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          npm run test:rust
      - name: Check JavaScript, saved data and installers
        run: |
          npm run build
          npm test
          npm run test:install

  browser:
    name: Browser shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/verify-setup
        with:
          browser: 'true'
      - run: npm run build
      - name: Check browser and native Herdr behavior
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/4
          BROWSER_JOBS: '2'
        run: npm run verify:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.diagnostics-name }}-shard-${{ matrix.shard }}
          path: |
            .test-artifacts/*.json
            .test-artifacts/browser/**
          if-no-files-found: ignore
          include-hidden-files: true

  reliability:
    name: Browser reliability with ${{ matrix.workers }} workers
    if: inputs.reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/verify-setup
        with:
          browser: 'true'
      - run: npm run build
      - name: Repeat reading and selection checks with delayed responses and input delivery
        env:
          BROWSER_RELIABILITY_JOBS: ${{ matrix.workers }}
        run: npm run verify:browser-reliability
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.diagnostics-name }}-reliability-${{ matrix.workers }}
          path: |
            .test-artifacts/*.json
            .test-artifacts/browser/**
          if-no-files-found: ignore
          include-hidden-files: true
