name: Verify

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      diagnostics-name:
        default: integration-check-diagnostics
        type: string
      base:
        default: ''
        type: string
      force:
        default: false
        type: boolean
      quick-checked:
        default: false
        type: boolean
      reliability:
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  LIBERTTY_DEV_SKIP_BUILD: '1'

jobs:
  lookup:
    name: Find verified source tree
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      verified: ${{ steps.tree.outputs.verified }}
      reliability: ${{ steps.tree.outputs.reliability }}
      documentation: ${{ steps.tree.outputs.documentation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.base != '' && '0' || '1' }}
          persist-credentials: false
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_FORCE: ${{ inputs.force }}
          VERIFY_BASE: ${{ inputs.base }}
          VERIFY_QUICK_CHECKED: ${{ inputs.quick-checked }}
          VERIFY_RELIABILITY: ${{ inputs.reliability }}
        run: node scripts/verified-tree.mjs

  rust:
    needs: lookup
    if: needs.lookup.outputs.verified != 'true' && needs.lookup.outputs.documentation != 'true'
    name: Rust and unit tests
    env:
      VERIFY_QUICK_DONE: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/verify-setup
      - name: Run quick checks when the caller has no separate quick job
        if: '!inputs.quick-checked'
        run: |
          npm run ci:quick
          cargo fmt --all -- --check
          npm run contracts:vocabulary -- --check
      - name: Check native lints and tests
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          npm run test:rust
      - name: Check JavaScript, saved data and installers
        run: |
          npm run build:frontend
          npm test
          npm run test:install

  browser:
    needs: lookup
    if: needs.lookup.outputs.verified != 'true' && needs.lookup.outputs.documentation != 'true'
    name: Browser shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/verify-setup
        with:
          browser: 'true'
      - run: npm run build
      - name: Check browser and native Herdr behavior
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/4
          BROWSER_JOBS: '2'
          BROWSER_RETRIES: '1'
        run: npm run verify:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.diagnostics-name }}-shard-${{ matrix.shard }}
          path: |
            .test-artifacts/*.json
            .test-artifacts/browser/**
          if-no-files-found: ignore
          include-hidden-files: true

  reliability:
    needs: lookup
    name: Browser reliability with ${{ matrix.workers }} workers
    if: inputs.reliability && needs.lookup.outputs.reliability != 'true' && needs.lookup.outputs.documentation != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/verify-setup
        with:
          browser: 'true'
      - run: npm run build
      - name: Repeat reading and selection checks with delayed responses and input delivery
        env:
          BROWSER_RELIABILITY_JOBS: ${{ matrix.workers }}
        run: npm run verify:browser-reliability
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.diagnostics-name }}-reliability-${{ matrix.workers }}
          path: |
            .test-artifacts/*.json
            .test-artifacts/browser/**
          if-no-files-found: ignore
          include-hidden-files: true

  complete:
    name: Record verified source tree
    needs: [lookup, rust, browser, reliability]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require fresh checks or a verified tree for every required suite
        env:
          LOOKUP: ${{ needs.lookup.result }}
          DOCUMENTATION_ONLY: ${{ needs.lookup.outputs.documentation }}
          VERIFIED: ${{ needs.lookup.outputs.verified }}
          RELIABILITY_VERIFIED: ${{ needs.lookup.outputs.reliability }}
          REQUIRED: ${{ inputs.reliability }}
          RUST: ${{ needs.rust.result }}
          BROWSER: ${{ needs.browser.result }}
          RELIABILITY: ${{ needs.reliability.result }}
        run: node scripts/verified-tree.mjs gate
      - name: Write the verification marker
        if: needs.lookup.outputs.documentation != 'true'
        env:
          TREE: ${{ needs.lookup.outputs.tree }}
        run: |
          mkdir -p .test-artifacts
          printf '%s\n' "$TREE" > .test-artifacts/verified-tree.txt
      - uses: actions/upload-artifact@v7
        if: needs.lookup.outputs.verified != 'true' && needs.lookup.outputs.documentation != 'true'
        with:
          name: verified-${{ needs.lookup.outputs.tree }}
          path: .test-artifacts/verified-tree.txt
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: inputs.reliability && needs.lookup.outputs.reliability != 'true' && needs.lookup.outputs.documentation != 'true'
        with:
          name: verified-${{ needs.lookup.outputs.tree }}-reliability
          path: .test-artifacts/verified-tree.txt
          retention-days: 30
