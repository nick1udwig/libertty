name: Full platform validation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-rust-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: Native checks and builds on ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.8.1'
          cache: npm
      - name: Install native test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config openssh-server bash-completion
          sudo mkdir -p /run/sshd
      - name: Install modern Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash git
          echo "TERMAI_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          git_completion="$(brew --prefix git)/etc/bash_completion.d/git-completion.bash"
          test -r "$git_completion"
          echo "TERMAI_GIT_COMPLETIONS_FILE=$git_completion" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Cache Rust dependencies and compiled artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: termai-${{ matrix.target }}
          cache-on-failure: true
          cache-bin: false
      - name: Verify runner architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e 'if (process.platform + "-" + process.arch !== process.env.EXPECTED_TARGET) throw new Error("Runner architecture mismatch")'
      - name: Install dependencies and verify generated contracts
        run: |
          npm ci --no-audit --no-fund
          npm run migration:schemas -- --check
          npm run migration:inventory -- --check
          npm run migration:vocabulary -- --check
      - name: Verify Rust formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --package termai-engine --target wasm32-unknown-unknown --lib --locked -- -D warnings
      - name: Verify Rust unit and parity tests
        run: npm run test:rust
      - name: Verify saved-data compatibility
        run: npm run test:rust-state
      - name: Build native backend, WebAssembly and frontend
        run: npm run build
      - name: Verify JavaScript, contracts and installer tests
        run: |
          npm test
          npm run test:install
      - name: Build the optimized release backend
        run: cargo build --locked --release -p termai-server --bin termai
      - name: Record build provenance and checksums
        run: |
          node scripts/ci-build.mjs create browser .test-artifacts/browser-build.json
          node scripts/ci-build.mjs create release .test-artifacts/release-build.json
      - name: Verify native packages and installation
        env:
          TERMAI_RELEASE_ALLOW_DIRTY: '1'
          TERMAI_RELEASE_BUILD_MANIFEST: .test-artifacts/release-build.json
          TARGET: ${{ matrix.target }}
        run: |
          npm run release:package
          node scripts/smoke-release.mjs "release/termai-v$(node -p 'require("./package.json").version')-$TARGET.tar.gz"
          node scripts/smoke-install.mjs "release/termai-v$(node -p 'require("./package.json").version')-$TARGET.tar.gz"
      - name: Archive builds with executable permissions
        run: |
          tar -czf .test-artifacts/browser-build.tar.gz dist src/engine/termai-engine.wasm target/debug/termai target/debug/examples/herdr_snapshot .test-artifacts/browser-build.json
          tar -czf .test-artifacts/release-build.tar.gz dist target/release/termai .test-artifacts/release-build.json
      - uses: actions/upload-artifact@v7
        with:
          name: validated-browser-${{ matrix.target }}
          path: .test-artifacts/browser-build.tar.gz
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: validated-release-${{ matrix.target }}
          path: .test-artifacts/release-build.tar.gz
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-migration-native-${{ matrix.target }}
          path: |
            .test-artifacts/*.json
            release/*.sha256
          if-no-files-found: ignore
          include-hidden-files: true

  browser:
    needs: parity
    name: Browser ${{ matrix.suite }} on ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [terminal, herdr, input]
        target: [linux-x64, linux-arm64, darwin-arm64]
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.8.1'
          cache: npm
      - name: Install native test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config openssh-server bash-completion
          sudo mkdir -p /run/sshd
      - name: Install modern Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash git
          echo "TERMAI_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          git_completion="$(brew --prefix git)/etc/bash_completion.d/git-completion.bash"
          test -r "$git_completion"
          echo "TERMAI_GIT_COMPLETIONS_FILE=$git_completion" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: validated-browser-${{ matrix.target }}
          path: .test-artifacts
      - name: Restore and verify the native and frontend build
        run: |
          tar -xzpf .test-artifacts/browser-build.tar.gz
          node scripts/ci-build.mjs verify browser .test-artifacts/browser-build.json
      - uses: actions/download-artifact@v8
        if: matrix.suite == 'terminal'
        with:
          name: validated-release-${{ matrix.target }}
          path: .test-artifacts
      - name: Restore the release build
        if: matrix.suite == 'terminal'
        run: |
          tar -xzpf .test-artifacts/release-build.tar.gz
          node scripts/ci-build.mjs verify release .test-artifacts/release-build.json
      - name: Install browser test prerequisites
        run: |
          npx --no-install playwright-core install --with-deps chromium
          echo "CHROME_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "CHROMIUM=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify actual browser WebAssembly
        if: matrix.suite == 'terminal'
        run: npm run test:rust-browser
      - name: Verify terminal and SSH browser workflows
        if: matrix.suite == 'terminal'
        run: |
          TEST_ENGINE=server TEST_PORT=3137 npm run test:browser
          TEST_ENGINE=client TEST_PORT=3138 TEST_BASE_PATH=/terminal npm run test:browser
          TEST_BASE_PATH=/terminal npm run test:reading
      - name: Verify Herdr protocol and plugin browser workflows
        if: matrix.suite == 'herdr'
        run: |
          npm run test:herdr
          npm run test:herdr-loading
          npm run test:plugins
          npm run test:rust-herdr
      - name: Verify development pairing and reconnect
        if: matrix.suite == 'input'
        env:
          TERMAI_DEV_BUILD_MANIFEST: .test-artifacts/browser-build.json
        run: |
          npm run test:pairing
          npm run test:reconnect
          npm run test:herdr-reopen
      - name: Verify gestures and touch input
        if: matrix.suite == 'input'
        run: |
          npm run test:gestures
          npm run test:touch
      - name: Verify dictation and file transfers
        if: matrix.suite == 'input'
        run: |
          node test/dictation-browser.mjs
          node test/transfers-browser.mjs
      - name: Verify files and workspace browser workflows
        if: matrix.suite == 'input'
        run: |
          node test/files-browser.mjs
          npm run test:workspace
      - name: Verify supported native Herdr integration
        if: matrix.suite == 'herdr'
        run: |
          node scripts/install-test-herdr.mjs
          export HERDR_BINARY="$PWD/.test-artifacts/bin/herdr"
          export PATH="$PWD/.test-artifacts/bin:$PATH"
          npm run test:herdr-dictation
          npm run test:herdr-spaces
          npm run test:herdr-resize
          npm run test:herdr-flash
          npm run test:herdr-scroll
      - name: Verify both engine modes in the packaged executable
        if: matrix.suite == 'terminal'
        env:
          TERMAI_RELEASE_ALLOW_DIRTY: '1'
          TERMAI_RELEASE_BUILD_MANIFEST: .test-artifacts/release-build.json
        run: |
          npm run release:package
          package_directory=$(mktemp -d)
          trap 'rm -rf "$package_directory"' EXIT
          tar -xzpf "release/termai-v$(node -p 'require("./package.json").version')-${{ matrix.target }}.tar.gz" -C "$package_directory"
          TEST_EXECUTABLE="$package_directory/bin/termai" TEST_ENGINE=server TEST_PORT=3137 TEST_BASE_PATH=/terminal npm run test:browser
          TEST_EXECUTABLE="$package_directory/bin/termai" TEST_ENGINE=client TEST_PORT=3138 TEST_BASE_PATH=/terminal npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-migration-${{ matrix.target }}-${{ matrix.suite }}
          path: .test-artifacts/*.json
          if-no-files-found: ignore
          include-hidden-files: true
