[package]
name = "termai-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
termai-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
base64 = "0.22.1"
sha2 = "0.10.9"
rand = "0.8.6"
subtle = "2.6.1"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
scrypt = "0.11.0"
ssh-key = { version = "0.6.7", features = ["crypto", "encryption", "ed25519", "rsa"] }
zeroize = "1.9.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures = "0.3.34"
libc = "0.2.190"
unicode-normalization = "0.1.25"
axum = { version = "0.8.9", features = ["ws"] }
portable-pty = "0.9.0"
url = "2.5.8"
percent-encoding = "2.3.2"
icu_collator = "=2.3.1"
tokio-tungstenite = "0.29.0"
p256 = "0.13.2"
web-push = { version = "=0.11.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
russh = { version = "=0.63.1", default-features = false, features = ["ring", "rsa", "dsa", "des"] }
russh-sftp = "=2.1.1"
openssl = { version = "=0.10.81", features = ["vendored"] }

[[bin]]
name = "termai"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
